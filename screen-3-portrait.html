/* Image carousel ticker */
.image-ticker{position:fixed;left:0;right:0;bottom:0;z-index:45;height:300px;display:none;overflow:hidden;background:#201912;border-top:3px solid var(--gold);box-shadow:0 -5px 18px rgba(53,42,32,.24)}.image-ticker.active{display:block}.image-ticker-track{display:flex;width:max-content;height:100%;animation:image-ticker-scroll var(--image-ticker-duration,70s) linear infinite;will-change:transform}.image-ticker-group{display:flex;flex:0 0 auto;gap:16px;padding-right:16px}.image-ticker-card{flex:0 0 300px;height:280px;margin:10px 0;overflow:hidden;border-radius:9px;background:#fffaf1;box-shadow:0 2px 8px rgba(0,0,0,.22)}.image-ticker-card img{display:block;width:300px;height:220px;object-fit:cover;background:#e9dcc8}.image-ticker-caption{height:60px;display:flex;align-items:center;justify-content:center;padding:6px 12px;text-align:center;color:var(--ink);font-family:'Work Sans',Segoe UI,Arial,sans-serif;font-size:20px;font-weight:700;line-height:1.12}.image-ticker-card.image-error{display:none}@keyframes image-ticker-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}body.image-ticker-visible .screen{padding-bottom:316px!important}
.cms-badge{white-space:nowrap}.badge-gf{color:#2F7755!important;border-color:rgba(47,119,85,.55)!important}.badge-featured{color:#8C3B2E!important}.badge-new{color:#356F68!important}.cms-chile-indicator{flex:0 0 auto}</style></head>
<body data-screen="Screen 3"><div class="rigid-tv-canvas"><main class="screen"><header class="header"><div><h1>Arlene's Beans</h1><div class="kicker">New Mexican Kitchen</div></div><div class="screen-title">Appetizers · Family Style · Bulk · Sides / Add-ons · Chile · Dessert</div></header>
<section id="content" class="content"><div class="loading">Connecting to Arlenes Menu…</div></section>
<footer class="footer"><div>Screen 3 of 3</div><div class="chiles"><span class="chile-key"><i class="chile-dot c-green"></i>Green</span><span class="chile-key"><i class="chile-dot c-red"></i>Red</span><span class="chile-key"><i class="chile-dot c-xmas"></i>Christmas</span></div><div id="status" class="status">Starting…</div></footer></main><aside id="image-ticker" class="image-ticker" aria-hidden="true"><div class="image-ticker-track"></div></aside>
</div><script>
(function fitRigidLeft(){
  function fitCanvas(){
    const scale=Math.min(window.innerWidth/1920,window.innerHeight/1080);
    document.documentElement.style.setProperty('--rigid-tv-scale',String(scale));
  }
  fitCanvas();
  window.addEventListener('resize',fitCanvas,{passive:true});
})();
</script><script>
const SPREADSHEET_ID = "1GTRoGkk0LvorgMhXi4d0cddFQ0-96VxBmJ9pOuN4od8";
const SHEET_NAME = "Menu_Master";
const TACOS_PANEL_SHEET = "Tacos Panel de control";
const FUNCTIONS_SHEET = "Functions";
const IMAGE_TICKER_SHEET = "Image Ticker";
const TARGET_SCREEN = document.body.dataset.screen;
const CHANGE_SIGNAL_SHEET = "Control Panel";
const CHANGE_SIGNAL_RANGE = "H7";
const SIGNAL_POLL_MS = 15000;
const content = document.getElementById("content");
const statusEl = document.getElementById("status");
const imageTickerEl = document.getElementById("image-ticker");
const clean=v=>(v===null||v===undefined?"":String(v).trim());
const truthy=v=>v===true||v===1||v==="1"||clean(v).toLowerCase()==="true";
const esc=s=>clean(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function val(cell){return !cell||cell.v===null||cell.v===undefined?"":cell.v}
function rowsFrom(table){const h=table.cols.map((c,i)=>clean(c.label)||clean(c.id)||("COL_"+i));return table.rows.map(r=>{const o={};h.forEach((x,i)=>o[x]=val(r.c[i]));return o})}
function priceOf(r){const p=clean(r.Price_Display);if(p)return p;const v=r.Base_Price;if(v===""||v==null)return "";const n=Number(String(v).replace(/[$,]/g,""));return Number.isFinite(n)?"$"+n.toFixed(2):clean(v)}
function density(items){const score=items.length+items.filter(x=>clean(x.Description)).length*.38;document.body.classList.remove("dense","ultra");if(TARGET_SCREEN==="Screen 3"||score>46)document.body.classList.add("ultra");else if(score>30)document.body.classList.add("dense")}
function panelData(table){
 if(!table)return {items:new Map(),proteins:[]};
 const raw=table.rows.map(r=>r.c.map(val)),items=new Map(),proteins=[];
 let mode="";
 for(const row of raw){
   const first=clean(row[0]);
   if(first==="Item_ID"){mode="items";continue}
   if(first==="Protein_ID"){mode="proteins";continue}
   if(first.startsWith("INSTRUCCIONES")){mode="";continue}
   if(mode==="items"&&/^TACO/i.test(first))items.set(clean(row[2]),first);
   if(mode==="proteins"&&/^PROT/i.test(first))proteins.push({id:first,active:row[1],name:row[2],priceType:row[3],price:row[4],order:row[5],showOn:row[10]});
 }
 proteins.sort((a,b)=>(Number(a.order)||99999)-(Number(b.order)||99999)||clean(a.name).localeCompare(clean(b.name)));
 return {items,proteins};
}
function tagsFor(item,panel){
 const itemName=clean(item.Display_Name),isProteinList=["protein available","available protein"].includes(itemName.toLowerCase());
 const tacoId=panel.items.get(itemName);
 if(!tacoId&&!isProteinList)return "";
 const tags=panel.proteins.filter(p=>truthy(p.active)&&(isProteinList||clean(p.showOn).split(",").map(clean).includes(tacoId)));
 if(!tags.length)return "";
 return `<div class="protein-tags">${tags.map(p=>{const extra=clean(p.priceType).toLowerCase()==="upcharge",price=/carne asada/i.test(clean(p.name))?"$2.99":clean(p.price);const displayName=/carne asada/i.test(clean(p.name))?"Asada":clean(p.name);return `<span class="protein-tag${extra?" upcharge":""}">${esc(displayName)}${extra&&price?" +"+esc(price):""}</span>`}).join("")}</div>`;
}
function isProteinBanner(item){return ["protein available","available protein","available proteins"].includes(clean(item.Display_Name).toLowerCase())}
function groupUsesProteins(name){
 const n=clean(name).toLowerCase();
 return n.includes("breakfast")||n.includes("appetizer")||n.includes("tacos")||n.includes("taquitos")||n.includes("burrito")||n.includes("plate")||n.includes("entrée")||n.includes("entree");
}
function proteinBanner(panel){
 const tags=tagsFor({Display_Name:"Protein Available"},panel);
 return tags?`<article class="protein-banner"><div class="protein-heading">PROTEINS</div>${tags}</article>`:"";
}
const CHILE_ITEMS=new Set([
 "enchilada plate","enchilada bowl","relleno plate","tamale & relleno plate","tamale plate","frito pie","asada fries","chile cheese tots","chile cheese fries","los padilla breakfast burrito jr","los padilla smothered","breakfast chimichanga","huevos rancheros","chile relleno solo with meat on top"
]);
function chileOptions(item){
 const selected=clean(item.Chile_Indicator).toLowerCase();
 if(selected==="green")return `<span class="chile-options cms-chile-indicator" aria-label="Green chile"><i class="chile-dot c-green"></i></span>`;
 if(selected==="red")return `<span class="chile-options cms-chile-indicator" aria-label="Red chile"><i class="chile-dot c-red"></i></span>`;
 if(selected==="xmas"||selected==="christmas")return `<span class="chile-options cms-chile-indicator" aria-label="Christmas chile"><i class="chile-dot c-xmas"></i></span>`;
 if(selected==="none")return "";
 const name=clean(item.Display_Name).toLowerCase().replace(/[.]+$/g,"");
 if(name==="chicken wings")return `<div class="wing-options"><span class="buffalo">BUFFALO</span> • <span class="jalamango">JALAMANGO</span> • <span class="plain">PLAIN</span></div>`;
 return CHILE_ITEMS.has(name)?`<span class="chile-options" aria-label="Green, red or Christmas chile"><i class="chile-dot c-green"></i><i class="chile-dot c-red"></i><i class="chile-dot c-xmas"></i></span>`:"";
}
function combinationDetails(item,description,priceDisplay){
 if(clean(item.Display_Name).toLowerCase()!=="combination plate")return "";
 const parts=clean(description).split("|").map(clean).filter(Boolean);
 if(parts.length<2)return "";
 const priceParts=clean(priceDisplay).split("/").map(clean).filter(Boolean);
 const priceGrid=priceParts.length?`<div class="combination-prices">${priceParts.map(p=>{const m=p.match(/^(\d+)\s*items?\s*\$?(.+)$/i);return m?`<div class="combination-price"><small>${esc(m[1])} item${m[1]==="1"?"":"s"}</small><strong>$${esc(m[2])}</strong></div>`:`<div class="combination-price"><strong>${esc(p)}</strong></div>`}).join("")}</div>`:"";
 const choices=parts.slice(1).map(line=>{
   const i=line.indexOf(":"),rawName=clean(i>=0?line.slice(0,i):line),detail=i>=0?line.slice(i+1):"";
   const badgeMatch=rawName.match(/\[([^\]]+)\]/),badge=badgeMatch?clean(badgeMatch[1]):"",name=clean(rawName.replace(/\s*\[[^\]]+\]\s*/," "));
   const hasChile=/^(tamale|small smothered burrito|smothered burrito|rolled enchilada)/i.test(name);
   const badgeClass=/combination only/i.test(badge)?" combination-only":"";
   return `<div class="combination-choice"><span class="combination-name">${esc(name)}</span>${badge?`<span class="solo-price${badgeClass}">${esc(badge)}</span>`:""}${hasChile?`<span class="chile-options" aria-label="Green, red or Christmas chile"><i class="chile-dot c-green"></i><i class="chile-dot c-red"></i><i class="chile-dot c-xmas"></i></span>`:""}${detail?`<span>${esc(detail)}</span>`:""}</div>`;
 }).join("");
 return `<div class="combination-details"><div class="combination-lead">${esc(parts[0])}</div>${priceGrid}${choices}</div>`;
}
function categoryClass(name){
 const n=clean(name).toLowerCase();
 return n==="chile"||n==="beverages"?" compact-category":"";
}
function categoryHeaderOptions(name){
 const n=clean(name).toLowerCase();
 if(n!=="burritos in foil"&&n!=="smothered burritos")return "";
 return `<div class="section-chiles"><span class="chile-key"><i class="chile-dot c-green"></i>Green</span><span class="chile-key"><i class="chile-dot c-red"></i>Red</span><span class="chile-key"><i class="chile-dot c-xmas"></i>Christmas</span></div>`;
}
function categoryIntro(name){
 const n=clean(name).toLowerCase();
 if(n==="burritos in foil")return `<div class="category-intro"><strong>Burrito Jr.:</strong> Smaller handheld burrito wrapped in foil—easy to grab and go.</div>`;
 if(n==="smothered burritos")return `<div class="category-intro"><strong>Smothered Burrito:</strong> Flour-tortilla burrito covered with your choice of red, green or Christmas chile.</div>`;
 return "";
}
function badgesFor(item){const b=badgesById.get(clean(item.Menu_ID));let out="";if(b){if(b.crown)out+=`<span class="menu-badge badge-crown" aria-label="House favorite">♛</span>`;if(b.best)out+=`<span class="menu-badge badge-best">BEST SELLER</span>`;if(b.heart)out+=`<span class="menu-badge badge-heart" aria-label="Favorite">♡</span>`;}const cms=clean(item.Badges).split(",").map(x=>x.trim()).filter(Boolean);for(const badge of cms){const k=badge.toLowerCase();if(k==="best seller"&&!/BEST SELLER/.test(out))out+=`<span class="menu-badge badge-best cms-badge">BEST SELLER</span>`;else if(k==="gluten friendly")out+=`<span class="menu-badge cms-badge badge-gf">GF</span>`;else if(k==="featured")out+=`<span class="menu-badge cms-badge badge-featured">FEATURED</span>`;else if(k==="new")out+=`<span class="menu-badge cms-badge badge-new">NEW</span>`;}return out?`<span class="item-badges">${out}</span>`:""}
function updateImageTicker(rows){
 const setting=rows.find(r=>clean(r.Setting).toLowerCase()==="scroll_speed"),speed=Math.max(25,Math.min(180,Number(setting&&setting.Value)||70));
 const source=rows.filter(r=>truthy(r.Active)&&truthy(r[TARGET_SCREEN])&&clean(r.Image_URL)).sort((a,b)=>(Number(a.Display_Order)||99999)-(Number(b.Display_Order)||99999));
 const active=source.length>0;imageTickerEl.classList.toggle("active",active);imageTickerEl.setAttribute("aria-hidden",active?"false":"true");document.body.classList.toggle("image-ticker-visible",active);
 if(!active){imageTickerEl.querySelector(".image-ticker-track").innerHTML="";return}
 const items=[];while(items.length<Math.max(4,source.length))items.push(...source);const cards=items.map(r=>`<article class="image-ticker-card"><img src="${esc(r.Image_URL)}" alt="${esc(r.Description)}" onerror="this.closest('.image-ticker-card').classList.add('image-error')"><div class="image-ticker-caption">${esc(r.Description)}</div></article>`).join("");const track=imageTickerEl.querySelector(".image-ticker-track");track.style.setProperty("--image-ticker-duration",speed+"s");track.innerHTML=`<div class="image-ticker-group">${cards}</div><div class="image-ticker-group" aria-hidden="true">${cards}</div>`;
}
function renderMenuItem(item,groupName,panel){
 if(isProteinBanner(item))return "";
 const rawPrice=priceOf(item),hideVariant=["burritos in foil","smothered burritos"].includes(clean(groupName).toLowerCase()),v=hideVariant?"":clean(item.Variant_or_Size),d=clean(item.Dietary),x=clean(item.Description),combo=combinationDetails(item,x,rawPrice),p=combo?"":rawPrice,chile=chileOptions(item);
 return `<article class="item"><div class="top"><span class="name">${badgesFor(item)}${esc(item.Display_Name)}</span>${chile}${p?`<span class="dots"></span><span class="price">${esc(p)}</span>`:""}</div>${combo||((v||x||d)?`<div class="desc">${v?`<span class="variant">${esc(v)}</span>${x?" · ":""}`:""}${x?esc(x):""}${d?` <span class="dietary">(${esc(d)})</span>`:""}</div>`:"")}${tagsFor(item,panel)}</article>`;
}
function renderStandardCategory(group,panel){
 return `<section class="category${categoryClass(group.name)}"><div class="category-head"><h2 class="category-title">${esc(group.name)}</h2>${categoryHeaderOptions(group.name)}</div>${categoryIntro(group.name)}${groupUsesProteins(group.name)?proteinBanner(panel):""}${group.items.map(item=>renderMenuItem(item,group.name,panel)).join("")}</section>`;
}
function renderSidesCategory(group,panel){
 return `<section class="compact-frame sides-frame"><div class="category-head"><h2 class="category-title">Sides / Add-ons</h2></div><div class="compact-items">${group.items.map(item=>renderMenuItem(item,group.name,panel)).join("")}</div></section>`;
}
function renderChileDessert(chileGroup,dessertGroup,panel){
 const column=group=>`<div class="compact-column"><div class="category-head"><h2 class="category-title">${esc(group.name)}</h2></div>${group.items.map(item=>renderMenuItem(item,group.name,panel)).join("")}</div>`;
 return `<section class="compact-frame dual-frame">${column(chileGroup)}${column(dessertGroup)}</section>`;
}
function render(rows,panelTable){
 const panel=panelData(panelTable);
 let items=rows.filter(r=>truthy(r.Active)&&clean(r.Screen_Suggestion)===TARGET_SCREEN&&!(TARGET_SCREEN==="Screen 3"&&/^(beverages|alcohol drinks)$/i.test(clean(r.Display_Category))));
 items.sort((a,b)=>(Number(a.Display_Order)||99999)-(Number(b.Display_Order)||99999)||clean(a.Display_Name).localeCompare(clean(b.Display_Name)));
 density(items);
 const groups=[],map=new Map();
 for(const item of items){const c=clean(item.Display_Category)||"Menu";if(!map.has(c)){const g={name:c,items:[]};map.set(c,g);groups.push(g)}map.get(c).items.push(item)}
 const priorityCategories=["appetizers","family style","bulk"];
 groups.sort((a,b)=>{const ai=priorityCategories.indexOf(clean(a.name).toLowerCase()),bi=priorityCategories.indexOf(clean(b.name).toLowerCase());return (ai<0?priorityCategories.length:ai)-(bi<0?priorityCategories.length:bi)});
 if(!groups.length){content.innerHTML=`<div class="error"><strong>No items assigned to ${esc(TARGET_SCREEN)}.</strong><br>Check Active and Screen_Suggestion in Menu_Master.</div>`;return}
 const chileGroup=groups.find(g=>clean(g.name).toLowerCase()==="chile"),dessertGroup=groups.find(g=>clean(g.name).toLowerCase()==="dessert");
 content.innerHTML=groups.map(g=>{const n=clean(g.name).toLowerCase();if(n==="sides"||n==="sides / add-ons")return renderSidesCategory(g,panel);if(n==="chile"&&dessertGroup)return renderChileDessert(g,dessertGroup,panel);if(n==="dessert"&&chileGroup)return "";return renderStandardCategory(g,panel)}).join("");
 statusEl.textContent="Synced "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
}
function fail(m){statusEl.textContent="Connection error";content.innerHTML=`<div class="error"><strong>Google Sheets could not be loaded.</strong><br>${esc(m)}<br><small>Keep the Sheet shared as Anyone with the link – Viewer.</small></div>`}
let masterRows=[],tacosPanel=null,badgesById=new Map();
window.arlenesMenuCallback=function(resp){try{if(!resp||!resp.table)throw new Error("Google returned no table data.");masterRows=rowsFrom(resp.table);render(masterRows,tacosPanel)}catch(e){fail(e.message||String(e))}};
window.arlenesTacosCallback=function(resp){if(resp&&resp.table){tacosPanel=resp.table;if(masterRows.length)render(masterRows,tacosPanel)}};
window.arlenesFunctionsCallback=function(resp){if(resp&&resp.table){badgesById=new Map(rowsFrom(resp.table).filter(r=>clean(r.Menu_ID)).map(r=>[clean(r.Menu_ID),{crown:truthy(r.Crown),best:truthy(r["Best Seller"]),heart:truthy(r.Heart)}]));if(masterRows.length)render(masterRows,tacosPanel)}};
window.arlenesImageTickerCallback=function(resp){if(resp&&resp.table)updateImageTicker(rowsFrom(resp.table))};
function addSheetLoader(id,sheet,callback,headers){const old=document.getElementById(id);if(old)old.remove();const s=document.createElement("script");s.id=id;s.src="https://docs.google.com/spreadsheets/d/"+SPREADSHEET_ID+"/gviz/tq?sheet="+encodeURIComponent(sheet)+"&tqx=responseHandler:"+callback+"&tq="+encodeURIComponent("select *")+"&headers="+headers+"&_="+Date.now();s.onerror=()=>{if(sheet===SHEET_NAME)fail("The Google Sheets endpoint did not respond.")};document.body.appendChild(s)}
function load(){statusEl.textContent="Syncing…";addSheetLoader("gsheet-loader",SHEET_NAME,"arlenesMenuCallback",1);addSheetLoader("tacos-panel-loader",TACOS_PANEL_SHEET,"arlenesTacosCallback",0);addSheetLoader("functions-loader",FUNCTIONS_SHEET,"arlenesFunctionsCallback",1);addSheetLoader("image-ticker-loader",IMAGE_TICKER_SHEET,"arlenesImageTickerCallback",1)}
let lastMenuChangeSignal=null;
window.arlenesChangeSignalCallback=function(resp){
 try{
  const cell=resp&&resp.table&&resp.table.rows&&resp.table.rows[0]&&resp.table.rows[0].c&&resp.table.rows[0].c[0];
  const signal=cell&&cell.v!==null&&cell.v!==undefined?String(cell.v):"";
  if(lastMenuChangeSignal===null){lastMenuChangeSignal=signal;return}
  if(signal!==lastMenuChangeSignal){lastMenuChangeSignal=signal;load()}
 }catch(e){}
};
function checkMenuChangeSignal(){
 const old=document.getElementById("menu-change-signal-loader");if(old)old.remove();
 const s=document.createElement("script");s.id="menu-change-signal-loader";
 s.src="https://docs.google.com/spreadsheets/d/"+SPREADSHEET_ID+"/gviz/tq?sheet="+encodeURIComponent(CHANGE_SIGNAL_SHEET)+"&range="+encodeURIComponent(CHANGE_SIGNAL_RANGE)+"&tqx=responseHandler:arlenesChangeSignalCallback&headers=0&_="+Date.now();
 document.body.appendChild(s);
}
load();checkMenuChangeSignal();setInterval(checkMenuChangeSignal,SIGNAL_POLL_MS);
</script></body></html>
